# mise is the project toolchain source of truth. Run `mise tasks` to discover
# the same build, test, lint, and image commands used by CI.

[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
node = "24.22.0"
oxfmt = "0.73.0"

[tasks.build]
description = "Compile the dexd binary"
run = "go build ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run unit and integration tests with the race detector"
run = "go test -race -timeout 30s ./... -coverprofile=cover.out"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w cmd internal"

[tasks.fmt-check]
description = "Verify Go formatting"
run = "test -z \"$(gofmt -l cmd internal)\""

[tasks.oxfmt]
description = "Format YAML, JSON, Markdown, and other non-Go project files"
run = "oxfmt --write ."

[tasks.oxfmt-check]
description = "Verify non-Go project formatting"
run = "oxfmt --check ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.tidy-check]
description = "Verify go.mod and go.sum are tidy"
run = "go mod tidy && git diff --exit-code go.mod go.sum"

[tasks.dev]
description = "Run dexd locally, loading .env when present"
run = "set -a; [ -f .env ] && . ./.env; set +a; go run ./cmd/dexd"

[tasks.docker-build]
description = "Build the container image locally as dexd-mikrotik:local"
run = "docker buildx bake"
