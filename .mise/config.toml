# mise is the project toolchain source of truth. Run `mise tasks` to discover
# the same build, test, lint, and image commands used by CI.

[tools]
actionlint = "1.7.12"
cosign = "3.1.6"
git-cliff = "2.14.2"
go = "1.27.4"
golangci-lint = "2.15.0"
lefthook = "2.2.3"
node = "26.13.1"
oxfmt = "0.75.0"

[tasks.build]
description = "Compile the dexd-mikrotik binary"
run = "go build ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run unit and integration tests with the race detector"
run = "go test -race -timeout 2m ./... -coverprofile=cover.out"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w cmd internal"

[tasks.fmt-check]
description = "Verify Go formatting"
run = "test -z \"$(gofmt -l cmd internal)\""

[tasks.oxfmt]
description = "Format YAML, JSON, Markdown, and other non-Go project files"
run = "oxfmt --write ."

[tasks.oxfmt-check]
description = "Verify non-Go project formatting"
run = "oxfmt --check ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.tidy-check]
description = "Verify go.mod and go.sum are tidy"
run = "go mod tidy && git diff --exit-code go.mod go.sum"

[tasks.actionlint]
description = "Lint the Forgejo workflows"
run = "actionlint -config-file .forgejo/actionlint.yaml .forgejo/workflows/*.yaml"

[tasks.release-scripts-test]
description = "Test the release version and changelog scripts"
run = "bash .forgejo/scripts/test-release-scripts.sh"

[tasks.dev]
description = "Run dexd-mikrotik locally (reads .env when present)"
run = "go run ./cmd/dexd-mikrotik"

[tasks.docker-build]
description = "Build the container image"
run = "docker build --build-arg GO_VERSION=$(mise config get tools.go) --tag dexd-mikrotik ."

[tasks.docker-run]
description = "Run the published dexd-mikrotik image with Docker Compose"
run = "docker compose up"

[hooks]
postinstall = "lefthook install"
