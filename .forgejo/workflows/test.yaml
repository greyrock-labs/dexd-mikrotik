---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ forgejo.ref }}-${{ forgejo.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: https://github.com/jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Check Go formatting
        run: mise run fmt-check

      - name: Vet
        run: mise run vet

      - name: Check go.mod tidiness
        run: mise run tidy-check

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Test release scripts
        run: mise run release-scripts-test

  image:
    name: image
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: https://github.com/jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Read Go version
        id: go
        run: echo "version=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
